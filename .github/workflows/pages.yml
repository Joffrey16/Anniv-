name: Publier la version web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Clé publique des notifications, calculée à partir du secret (vide tant qu'il n'est pas configuré).
      - name: Clé des notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            KEY=$(node push/vapid.mjs public)
            echo "EXPO_PUBLIC_VAPID_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Clé publique des notifications : ${KEY:0:12}…"
          fi
      # ID client Google (public), pour la connexion Google dans l'app installée sur iPhone.
      - name: ID client Google
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            ID=$(node push/google-client-id.mjs)
            echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID=$ID" >> "$GITHUB_ENV"
            echo "ID client Google : $ID"
          fi
      - run: npm run build:web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
