name: Rappels (notifications)

# Toutes les 15 minutes, envoie les notifications de rappel arrivées à échéance.
# Nécessite le secret FIREBASE_SERVICE_ACCOUNT (clé du compte de service Firebase, au format JSON).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # pour garder la tâche planifiée active

concurrency:
  group: rappels
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Vérifier la configuration
        id: conf
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT absent : notifications pas encore configurées."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.conf.outputs.ok == '1'
        with:
          sparse-checkout: push
      - uses: actions/setup-node@v4
        if: steps.conf.outputs.ok == '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push/package-lock.json
      - if: steps.conf.outputs.ok == '1'
        run: npm ci --prefix push --no-audit --no-fund
      - name: Envoyer les rappels
        if: steps.conf.outputs.ok == '1'
        run: node push/send.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # GitHub met en pause les tâches planifiées après 60 jours sans activité sur le dépôt.
      - name: Garder la tâche planifiée active
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/rappels.yml/enable" --silent
        env:
          GH_TOKEN: ${{ github.token }}
